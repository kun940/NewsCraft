# ============================================================
# NewsCraft 一键编排：MySQL + Redis + API + Worker + 前端
#
# 使用：
#   1. cp .env.example .env 并填好 MYSQL_PASSWORD / SECRET_KEY / DEEPSEEK_API_KEY
#   2. docker compose up -d --build
#   3. 访问 http://localhost:8080
#
# 停止： docker compose down
# 清库： docker compose down -v   （会删数据卷，慎用）
# ============================================================

services:

  # ---------------- 数据库 ----------------
  mysql:
    image: mysql:8.0
    container_name: newscraft-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_DATABASE: newscraft_app
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql_data:/var/lib/mysql
      # 首次启动自动执行建库/建表脚本（已存在则跳过）
      - ./scripts/migration:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - newscraft

  # ---------------- 缓存 & 任务队列 ----------------
  redis:
    image: redis:7-alpine
    container_name: newscraft-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      ${REDIS_PASSWORD:+--requirepass ${REDIS_PASSWORD}}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - newscraft

  # ---------------- 后端 API ----------------
  backend-api:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        # 需要 RAG/AI 能力时改成 true 并重新 build
        INSTALL_AI: "true"
    image: newscraft-backend:latest
    container_name: newscraft-api
    restart: unless-stopped
    env_file: .env
    environment:
      # 覆盖 config.yaml 里的 localhost，指向 compose 服务名
      DATABASE__HOST: mysql
      DATABASE__PORT: "3306"
      REDIS__HOST: redis
      TASKS__ARQ_REDIS_URL: redis://redis:6379/1
      # Chroma 向量库持久化目录（挂载到卷）
      CHROMA_PERSIST_DIR: /data/chroma
      APP__ENV: prod
      APP__DEBUG: "false"
    volumes:
      - chroma_data:/data/chroma
    ports:
      - "8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - newscraft

  # ---------------- arq 异步任务 worker（同一镜像，换 command）----------------
  backend-worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
      args:
        INSTALL_AI: "true"
    image: newscraft-backend:latest
    container_name: newscraft-worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE__HOST: mysql
      REDIS__HOST: redis
      TASKS__ARQ_REDIS_URL: redis://redis:6379/1
      CHROMA_PERSIST_DIR: /data/chroma
      APP__ENV: prod
    volumes:
      - chroma_data:/data/chroma
    command: ["arq", "tasks.worker.WorkerSettings"]
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend-api:
        condition: service_started
    networks:
      - newscraft

  # ---------------- 前端（nginx 托管 + 反代）----------------
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: newscraft-frontend:latest
    container_name: newscraft-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend-api
    networks:
      - newscraft

networks:
  newscraft:
    driver: bridge

volumes:
  mysql_data:
  redis_data:
  chroma_data:
